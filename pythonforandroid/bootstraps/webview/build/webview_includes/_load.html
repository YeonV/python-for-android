<!DOCTYPE html>
<html lang="en">
  <html>
    <head>
      <meta charset="utf-8" />
      <link href="_loading_style.css" rel="stylesheet" type="text/css" />
      <title>Blade&apos;s LedFx Loader</title>
    </head>
    <body>
        <div id="container">
            <div id="load">
                <div class="loader">Loading...</div>
            </div>
        </div>
        <div id="content">
            <img src="banner.png" id="banner" >
        </div>
        <!-- Sibling of #footer, not nested in #load: #load has its own
             position:relative, so an absolutely-positioned child anchors to
             THAT small box near the top instead of the full screen - the
             bug behind an earlier version of this landing at the very top
             instead of down by the footer where it belongs. -->
        <div id="status"><span>Waking up...</span></div>
        <div id="footer">
            <p>
                Android | by Blade
            </p>
        </div>
        <script>
            // Polls the one-word stage marker core.py writes at real startup
            // checkpoints (see boot_status.patch / getBootStatus()) instead of
            // guessing off a timer - measured startup time ranges from ~9s to
            // ~53s depending on the device, so no fixed schedule fits both.
            var STATUS_MESSAGES = {
                starting: "Waking up...",
                loading_modules: "Loading the toolbox...",
                connecting_audio: "Tuning into the sound...",
                starting_server: "Almost there..."
            };
            var lastStatus = null;
            var statusSpan = document.querySelector("#status span");

            function pollBootStatus() {
                if (typeof LedFxAndroidBridge === "undefined"
                        || !LedFxAndroidBridge.getBootStatus) {
                    return;
                }
                var status;
                try {
                    status = LedFxAndroidBridge.getBootStatus();
                } catch (e) {
                    return;
                }
                if (status && status !== lastStatus && STATUS_MESSAGES[status]) {
                    lastStatus = status;
                    // Crossfade instead of an instant swap: fade out, change
                    // text once invisible, fade back in. The box is a fixed
                    // size (see CSS), so only opacity ever moves - no jump.
                    statusSpan.style.opacity = "0";
                    setTimeout(function () {
                        statusSpan.textContent = STATUS_MESSAGES[status];
                        statusSpan.style.opacity = "1";
                    }, 350);
                }
            }

            setInterval(pollBootStatus, 500);
        </script>
    </body>
  </html>
</html>
