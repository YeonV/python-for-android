<!DOCTYPE html>
<html lang="en">
  <html>
    <head>
      <meta charset="utf-8" />
      <link href="_loading_style.css" rel="stylesheet" type="text/css" />
      <title>Blade&apos;s LedFx Loader</title>
    </head>
    <body>
        <div id="container">
            <div id="load">
                <div class="loader">Loading...</div>
                <div id="status">Waking up...</div>
            </div>
        </div>
        <div id="content">
            <img src="banner.png" id="banner" >
        </div>
        <div id="footer">
            <p>
                Android | by Blade
            </p>
        </div>
        <script>
            // Polls the one-word stage marker core.py writes at real startup
            // checkpoints (see boot_status.patch / getBootStatus()) instead of
            // guessing off a timer - measured startup time ranges from ~9s to
            // ~53s depending on the device, so no fixed schedule fits both.
            var STATUS_MESSAGES = {
                starting: "Waking up...",
                loading_modules: "Loading the toolbox...",
                connecting_audio: "Tuning into the sound...",
                starting_server: "Almost there..."
            };
            var lastStatus = null;

            function pollBootStatus() {
                if (typeof LedFxAndroidBridge === "undefined"
                        || !LedFxAndroidBridge.getBootStatus) {
                    return;
                }
                var status;
                try {
                    status = LedFxAndroidBridge.getBootStatus();
                } catch (e) {
                    return;
                }
                if (status && status !== lastStatus && STATUS_MESSAGES[status]) {
                    lastStatus = status;
                    document.getElementById("status").textContent =
                        STATUS_MESSAGES[status];
                }
            }

            setInterval(pollBootStatus, 500);
        </script>
    </body>
  </html>
</html>
